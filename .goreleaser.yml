version: 2

project_name: dune-cli

env:
  - AMPLITUDE_KEY={{ if index .Env "AMPLITUDE_KEY" }}{{ .Env.AMPLITUDE_KEY }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd
    binary: dune
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.amplitudeKey={{ .Env.AMPLITUDE_KEY }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

homebrew_casks:
  - name: dune-cli
    binaries:
      - dune
    homepage: https://github.com/duneanalytics/cli
    description: Command-line interface for the Dune API
    directory: Casks
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # Publishing stays off until the tap token secret exists, so releases
    # don't fail on it; prereleases are never published.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    # The binary is not signed or notarized, so clear the quarantine bit that
    # Homebrew sets on download; otherwise macOS refuses to run it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/dune"]
          end
    # The tap's main branch requires pull requests, so push a release branch
    # and open a PR instead of committing to main.
    repository:
      owner: duneanalytics
      name: homebrew-tap
      branch: "dune-cli-{{ .Version }}"
      token: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}{{ end }}'
      pull_request:
        enabled: true
        base:
          owner: duneanalytics
          name: homebrew-tap
          branch: main

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: duneanalytics
    name: cli
  draft: false
  prerelease: auto
  extra_files:
    - glob: install.sh
